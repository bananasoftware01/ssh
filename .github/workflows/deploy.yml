name: Build & Deploy Banana SSH

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            letieu/banana-ssh:${{ steps.vars.outputs.sha_short }}
            letieu/banana-ssh:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger tieu-orc Deployment Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORC_DISPATCH_TOKEN }}
          repository: letieu/tieu-orc-deployments
          event-type: deploy-banana-ssh
          client-payload: '{"image_tag": "${{ steps.vars.outputs.sha_short }}"}'
